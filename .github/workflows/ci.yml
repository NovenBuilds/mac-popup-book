name: 独立场景工程检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  discover:
    runs-on: macos-latest
    outputs:
      pages: ${{ steps.pages.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        name: 发现独立场景
        run: echo "pages=$(python3 scripts/page.py list --strict)" >> "$GITHUB_OUTPUT"
  common:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swift --version
      - name: 公共契约、格式、边界与语言
        run: |
          bash scripts/format.sh --check shared
          python3 scripts/check-boundaries.py --shared
          python3 scripts/check-localization.py --shared
          bash scripts/test.sh
  scene:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJSON(needs.discover.outputs.pages) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 单页行为、契约与预览签名打包
        env:
          PAGE_ID: ${{ matrix.page }}
        run: |
          python3 scripts/page.py check "$PAGE_ID"
          python3 scripts/page.py build "$PAGE_ID"
  candidate:
    needs: [common, scene]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链
        run: xcrun swift --version
      - name: 运行候选自动验收
        env:
          POPUP_BOOK_RECORD_PIPELINE_PERFORMANCE: "1"
        run: bash scripts/verify-candidate.sh
      - name: 整理候选产物
        if: always()
        run: bash scripts/package-ci-artifacts.sh
      - name: 上传验收日志与构建凭据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence-${{ github.sha }}
          path: build/ci-artifacts/evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: 上传可下载应用
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-app-${{ github.sha }}
          path: build/ci-artifacts/*.zip
          if-no-files-found: error
          retention-days: 30
